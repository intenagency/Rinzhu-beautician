[build]
  publish = "."

# Static files aur direct HTML pages ke liye routing rules
[[redirects]]
  from = "/superadmin"
  to = "/superadmin.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/beautician"
  to = "/beautician.html"
  status = 200

[[redirects]]
  from = "/franchise"
  to = "/franchise.html"
  status = 200

[[redirects]]
  from = "/franchise-kit"
  to = "/franchise-kit.html"
  status = 200

# Fallback for main index
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200