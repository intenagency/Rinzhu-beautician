<!DOCTYPE html>
<html lang="hi">
<head>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #334155; padding: 16px 8px 60px; color: #1e293b; }

    .top-bar {
      max-width: 820px;
      margin: 0 auto 12px;
      background: #0f172a;
      padding: 10px 14px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .lang-toggle {
      background: #334155;
      color: #fff;
      border: 1px solid #475569;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .lang-toggle.active { background: #be185d; border-color: #be185d; }
    .btn-pdf {
      background: #16a34a;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    .doc-page {
      background: #ffffff;
      width: 100%;
      max-width: 820px;
      margin: 0 auto 16px;
      padding: 24px 28px;
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    }

    .page-break { page-break-before: always; }

    .brand-header {
      border-bottom: 2.5px solid #be185d;
      padding-bottom: 8px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-title { font-size: 18px; font-weight: 800; color: #be185d; }
    .badge {
      background: #fdf2f8;
      color: #be185d;
      border: 1px solid #fbcfe8;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
    }
    .doc-heading {
      font-size: 15px;
      font-weight: 800;
      color: #831843;
      text-align: center;
      margin: 8px 0 12px;
      text-transform: uppercase;
    }
    .sec-title {
      font-size: 12px;
      font-weight: 800;
      color: #be185d;
      border-left: 3.5px solid #be185d;
      padding-left: 6px;
      margin: 12px 0 6px;
      text-transform: uppercase;
    }
    .box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 11.5px;
      line-height: 1.45;
      margin-bottom: 8px;
    }
    table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 11.5px; }
    th { background: #be185d; color: #fff; padding: 6px 8px; text-align: left; }
    td { padding: 6px 8px; border-bottom: 1px solid #e2e8f0; }
    tr:nth-child(even) td { background: #fdf2f8; }

    .cert-box {
      border: 3px double #be185d;
      padding: 24px 18px;
      border-radius: 8px;
      text-align: center;
      margin-top: 10px;
    }
    .sig-row { display: flex; justify-content: space-between; margin-top: 36px; text-align: center; font-size: 11.5px; }
    .sig-line { border-top: 1px solid #475569; width: 140px; margin: 0 auto 4px; }

    footer {
      background: #0b1120;
      color: #64748b;
      text-align: center;
      padding: 28px 16px;
      margin-top: 40px;
      font-size: 11.5px;
      border-top: 1px solid #1e293b;
      line-height: 1.6;
    }

    @media print {
      body { background: #fff; padding: 0; }
      .top-bar, footer { display: none; }
      .doc-page { box-shadow: none; max-width: 100%; margin: 0; padding: 18px; }
      .page-break { page-break-before: always; }
    }
  </style>
</head>
